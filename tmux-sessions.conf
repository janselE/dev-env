# tmux sessions to auto-create when `devstart` runs.
#
# Format: name|dir|command   (dir and command are both optional)
#   name              -> session opens in the caller's cwd
#   name|dir          -> session opens in dir
#   name|dir|command  -> session opens in dir and runs command
#   name||command     -> session opens in the caller's cwd and runs command
#
# dir supports env vars and ~, e.g. $HOME/Documents/dev-env or ~/Documents/dev-env
# Lines starting with # and blank lines are ignored.
# Existing sessions are left alone, so re-running is safe.

dev|$HOME/Documents/dev-env
am|$HOME/Documents/new-am/activity-monitoring
ms|$HOME/Documents/muscostreamer
tp|$HOME/Documents/triton-platform

